# Configuration de l'application Spring Boot pour l'agent IA
# Fichier: src/main/resources/application.yml

server:
  port: 8080
  servlet:
    context-path: /api

# Configuration des profils (dev, prod, test)
spring:
  profiles:
    active: dev

  # Configuration du client HTTP (pour les appels aux APIs LLM)
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: basic

# Configuration des clés API (à ne pas commiter en production !)
# Ces valeurs doivent être fournies via des variables d'environnement ou un service de secrets (ex: Vault)
app:
  mistral:
    api-key: ${MISTRAL_API_KEY:default_mistral_key}  # À remplacer par votre clé API Mistral
    base-url: https://api.mistral.ai/v1
    model: mistral-tiny  # Modèles disponibles: mistral-tiny, mistral-small, mistral-medium
    temperature: 0.7
    max-tokens: 2000

  tavily:
    api-key: ${TAVILY_API_KEY:default_tavily_key}  # À remplacer par votre clé API Tavily
    base-url: https://api.tavily.com
    max-results: 3
    search-depth: basic

# Configuration du logging
logging:
  level:
    com.example.agent: DEBUG
    org.springframework.web: INFO
    org.springframework.http: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Configuration pour la production (désactivée par défaut)
---
spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8080

logging:
  level:
    com.example.agent: INFO
    org.springframework.web: WARN

# Configuration pour les tests
---
spring:
  config:
    activate:
      on-profile: test

app:
  mistral:
    api-key: test_mistral_key
    base-url: http://localhost:8080/mock-mistral
  tavily:
    api-key: test_tavily_key
    base-url: http://localhost:8080/mock-tavily
