name: Deploy Backend

on:
  push:
    branches: [main, feature/deploy-backend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agentic_user
          POSTGRES_PASSWORD: agentic_password
          POSTGRES_DB: agentic_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

      - name: Build Docker image
        run: docker build -t agentic-ai-backend .

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag agentic-ai-backend ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-ai-backend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-ai-backend:latest
          docker tag agentic-ai-backend ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-ai-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-ai-backend:${{ github.sha }}

      - name: Deploy to AWS ECS
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: task-definition.json
          service: agentic-ai-service
          cluster: agentic-ai-cluster
          wait-for-service-stability: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to Google Cloud Run
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agentic-ai-backend
          image: ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-ai-backend:latest
          region: us-central1
          platform: managed
          allow-unauthenticated: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
